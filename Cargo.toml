[package]
name = "lua-astra"
version = "0.51.2"
authors = ["Elham Aryanpur <elhamaryanpur5@gmail.com>"]
description = "🔥 Blazingly Fast 🔥 runtime environment for Lua"
documentation = "https://astra.arkforge.net"
repository = "https://github.com/ArkForgeLabs/Astra"
keywords = ["lua", "scripting", "server", "webserver", "runtime"]
categories = [
  "web-programming",
  "command-line-utilities",
  "command-line-interface",
  "network-programming",
]
edition = "2024"
license = "Apache-2.0"
exclude = [".github", "examples", "docs", "tests"]
rust-version = "1.94"

[[bin]]
name = "astra"
path = "src/main.rs"

[features]
default = ["luajit"]
luajit = ["mlua/luajit"]
luajit52 = ["mlua/luajit52"]
luau = ["mlua/luau-jit"]
lua51 = ["mlua/lua51"]
lua52 = ["mlua/lua52"]
lua53 = ["mlua/lua53"]
lua54 = ["mlua/lua54"]
lua55 = ["mlua/lua55"]

[dependencies]
mlua = { version = "0.12.1", features = [
  "anyhow",
  "async",
  "macros",
  "send",
  "serialize",
  "vendored",
] }

# http
axum = { version = "0.8.9", features = ["http2", "macros", "multipart", "ws"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
reqwest = { version = "0.13.5", features = [
  "charset",
  "form",
  "http2",
  "json",
  "multipart",
  "rustls",
  "stream",
], default-features = false }
reqwest-websocket = "0.6.0"
tower = { version = "0.5.3" }
tower-http = { version = "0.7.1", features = [
  "compression-full",
  "decompression-full",
  "fs",
  "set-header",
  "trace",
] }
time = "0.3.55"
minijinja = { version = "2.24.0", features = [
  "loader",
  "loop_controls",
  "speedups",
  "urlencode",
] }
glob = "0.3.4"

# data formats
serde = { version = "1.0.229", features = ["derive"] }
serde-value = { version = "0.7.0" }
serde_json = "1.0.151"
serde_json5 = { version = "0.2.1" }
serde_yaml = { version = "0.9.34" }
serde_ini = { version = "0.2.0" }
csv = { version = "1.4.0" }
quick-xml = { version = "0.42.0", features = [
  "async-tokio",
  "encoding",
  "escape-html",
  "overlapped-lists",
  "serialize",
] }
toml = "1.1.6"
uuid = { version = "1.26.1", features = ["serde", "v4"] }
sha2 = "0.11.0"
sha3 = "0.12.0"
base64 = "0.23.1"
bytes = { version = "1.12.1", features = ["serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
markdown = { version = "1.0.0", features = ["serde"] }

# runtime
tokio = { version = "1.53.1", features = [
  "macros",
  "rt-multi-thread",
  "signal",
] }
futures = "0.3.34"
clap = { version = "4.6.7", features = ["cargo", "derive"] }
dotenvy = "0.15.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
version-compare = "0.2.1"
regex = "1.13.1"
pastey = "0.2.3"

# database
sqlx = { version = "0.9.0", features = [
  "chrono",
  "json",
  "postgres",
  "runtime-tokio",
  "sqlite",
  "tls-rustls",
  "uuid",
] }
include_dir = "0.7.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
overflow-checks = false
strip = true
debug = 0
[profile.release.package."*"]
opt-level = "z"
codegen-units = 1
strip = true
